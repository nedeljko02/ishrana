<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dnevnik ishrane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f6f5ee;
    --surface:#ffffff;
    --surface-2:#efeee3;
    --ink:#1f2420;
    --muted:#666f63;
    --border:#dedcce;
    --accent:#4b6b3e;
    --accent-ink:#f3f7ee;
    --accent-2:#c97b3d;
    --shadow:0 1px 2px rgba(31,36,32,.06),0 8px 24px -12px rgba(31,36,32,.12);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14170f;
      --surface:#1c2117;
      --surface-2:#242a1d;
      --ink:#edeee4;
      --muted:#9aa093;
      --border:#2c3125;
      --accent:#8fbf74;
      --accent-ink:#132110;
      --accent-2:#e2a063;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14170f;
    --surface:#1c2117;
    --surface-2:#242a1d;
    --ink:#edeee4;
    --muted:#9aa093;
    --border:#2c3125;
    --accent:#8fbf74;
    --accent-ink:#132110;
    --accent-2:#e2a063;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  .num, input[type="number"], .kcal-value{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header.top .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  header.top .brand .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  header.top h1{
    font-size:28px;
    letter-spacing:-.01em;
  }
  .lang-btn{
    width:40px;height:40px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .lang-btn:hover{background:var(--surface-2);}
  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:20px;
    position:sticky;
    top:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  /* ---- Calendar ---- */
  .cal-card{padding:18px;}
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-head .cal-title{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:16px;
    text-transform:capitalize;
  }
  .cal-selects{
    display:flex;
    gap:8px;
    flex:1;
    min-width:0;
    margin:0 6px;
  }
  .cal-select-label{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1;
    min-width:0;
  }
  .cal-select-label span{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
  }
  .cal-select-label select{
    width:100%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:5px 6px;
    font-size:12.5px;
    font-family:inherit;
  }
  .icon-btn{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    transition:background .15s ease;
  }
  .icon-btn:hover{background:var(--border);}
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-dow{
    font-size:10.5px;
    color:var(--muted);
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    font-size:12.5px;
    cursor:pointer;
    position:relative;
  }
  .cal-day:hover{background:var(--surface-2);}
  .cal-day.is-muted{color:var(--muted);opacity:.45;}
  .cal-day.is-today{border-color:var(--accent);}
  .cal-day.is-selected{background:var(--accent);color:var(--accent-ink);}
  .cal-day .dot{
    width:4px;height:4px;border-radius:50%;
    background:var(--accent-2);
  }
  .cal-day.is-selected .dot{background:var(--accent-ink);}
  .cal-foot{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .today-btn{
    width:100%;
    padding:9px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .today-btn:hover{background:var(--border);}
  .date-pick{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--muted);
  }
  .date-pick input{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:6px 8px;
    font-size:12.5px;
    font-family:inherit;
  }
  /* ---- Food (custom foods) card ---- */
  .food-card{padding:18px;}
  .food-card h3{font-size:15px;margin-bottom:12px;}
  .food-form{display:flex;flex-direction:column;gap:8px;}
  .food-form input[type="text"]{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:7px 9px;
    font-size:13px;
    font-family:inherit;
  }
  .food-form-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
  }
  .food-form-grid label{
    display:flex;
    flex-direction:column;
    gap:3px;
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .food-form-grid input{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:7px;
    padding:6px 6px;
    font-size:12.5px;
    width:100%;
  }
  .food-add-btn{
    padding:9px;
    border-radius:9px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
  }
  .food-add-btn:hover{filter:brightness(1.06);}
  .food-list{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:220px;
    overflow-y:auto;
  }
  .food-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:8px;
    background:var(--surface-2);
    font-size:12px;
  }
  .food-chip .fc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .food-chip .fc-kcal{color:var(--accent-2);font-weight:600;font-family:"IBM Plex Mono",monospace;}
  .food-chip .fc-del{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    width:18px;height:18px;border-radius:5px;font-size:13px;line-height:1;
  }
  .food-chip .fc-del:hover{background:var(--border);color:#b5484a;}
  .food-list-empty{font-size:11.5px;color:var(--muted);}
  /* ---- Main editor ---- */
  .day-head{
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .day-head .day-title{
    font-size:20px;
  }
  .day-head .day-sub{
    font-size:12.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .totals-strip{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .pill{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
    padding:6px 12px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--border);
    min-width:64px;
  }
  .pill.kcal{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
  }
  .pill .pill-label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    opacity:.75;
  }
  .pill .pill-value{
    font-size:15px;
    font-weight:600;
  }
  .meals{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .meal-card{padding:0;overflow:hidden;}
  .meal-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 18px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .meal-label-input{
    flex:1;
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:16px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    border-radius:7px;
    padding:4px 6px;
    min-width:80px;
  }
  .meal-label-input:hover{border-color:var(--border);}
  .meal-label-input:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  .meal-head input[type="time"]{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:7px;
    padding:4px 7px;
    font-size:12.5px;
    font-family:"IBM Plex Mono", monospace;
  }
  .meal-total{
    display:flex;
    gap:10px;
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
  }
  .meal-total b{color:var(--ink);}
  .meal-del{
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    width:26px;height:26px;
    border-radius:7px;
    flex-shrink:0;
  }
  .meal-del:hover{background:var(--border);color:#b5484a;}
  table.rows{
    width:100%;
    border-collapse:collapse;
  }
  table.rows thead th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    font-weight:600;
    padding:8px 10px 6px;
  }
  table.rows td{
    padding:5px 10px;
    border-top:1px solid var(--border);
    vertical-align:middle;
  }
  table.rows td.num-cell{
    text-align:right;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  table.rows td.num-cell.kcal-cell{color:var(--accent-2);font-weight:600;}
  .food-input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    padding:6px 7px;
    border-radius:7px;
    font-size:13.5px;
    font-family:inherit;
  }
  .food-input:hover{border-color:var(--border);}
  .food-input:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--surface);
  }
  .grams-input{
    width:64px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    padding:6px 7px;
    border-radius:7px;
    font-size:13.5px;
    text-align:right;
  }
  .grams-input:hover{border-color:var(--border);}
  .grams-input:focus{
    outline:none;
    border-color:var(--accent);
    background:var(--surface);
  }
  .row-del{
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    width:22px;height:22px;
    border-radius:6px;
  }
  .row-del:hover{background:var(--surface-2);color:#b5484a;}
  .add-row{
    width:100%;
    text-align:left;
    padding:8px 18px;
    border:none;
    border-top:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    cursor:pointer;
  }
  .add-row:hover{background:var(--surface-2);color:var(--accent);}
  tfoot td{
    padding:8px 10px;
    border-top:1px solid var(--border);
    font-size:12.5px;
    font-weight:600;
    background:var(--surface-2);
  }
  .add-meal-card{
    padding:14px 18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .add-meal-card input[type="text"]{
    flex:1;
    min-width:140px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:8px 10px;
    font-size:13.5px;
    font-family:inherit;
  }
  .add-meal-card input[type="time"]{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    border-radius:8px;
    padding:8px 9px;
    font-size:13px;
    font-family:"IBM Plex Mono", monospace;
  }
  .add-meal-btn{
    padding:9px 16px;
    border-radius:8px;
    border:1px dashed var(--accent);
    background:transparent;
    color:var(--accent);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-meal-btn:hover{background:var(--surface-2);}
  .actions{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:flex-end;
    padding:4px 2px;
  }
  .save-btn{
    padding:11px 20px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .save-btn:hover{filter:brightness(1.06);}
  .delete-btn{
    padding:11px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .delete-btn:hover{border-color:#b5484a;color:#b5484a;}
  .save-status{
    font-size:12.5px;
    color:var(--muted);
    min-height:16px;
  }
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--ink);
    color:var(--bg);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(-6px);
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" data-i18n="brandEyebrow">Lični dnevnik</span>
      <h1 data-i18n="brandTitle">Dnevnik ishrane</h1>
    </div>
    <button class="lang-btn" id="langToggle" type="button" title="Switch language">EN</button>
  </header>

  <div class="layout">
    <div class="sidebar">
      <!-- CALENDAR -->
      <aside class="card cal-card" id="calCard">
        <div class="cal-head">
          <button class="icon-btn" id="calPrev" type="button" data-i18n-aria="calPrevAria" aria-label="Prethodni mesec">‹</button>
          <div class="cal-selects">
            <label class="cal-select-label">
              <span data-i18n="calMonthLabel">Mesec</span>
              <select id="calMonthSelect"></select>
            </label>
            <label class="cal-select-label">
              <span data-i18n="calYearLabel">Godina</span>
              <select id="calYearSelect"></select>
            </label>
          </div>
          <button class="icon-btn" id="calNext" type="button" data-i18n-aria="calNextAria" aria-label="Sledeći mesec">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <button class="today-btn" id="gotoToday" type="button" data-i18n="calToday">Danas</button>
          <label class="date-pick">
            <span data-i18n="calGoTo">Idi na datum</span>
            <input type="date" id="datePicker">
          </label>
        </div>
      </aside>

      <!-- CUSTOM FOODS -->
      <aside class="card food-card" id="foodCard">
        <h3 data-i18n="foodPanelTitle">Dodaj svoju namirnicu</h3>
        <div class="food-form">
          <input type="text" id="newFoodName" data-i18n-ph="foodNameLabel" placeholder="Naziv">
          <div class="food-form-grid">
            <label><span data-i18n="pillP">P</span><input type="number" id="newFoodP" min="0" step="0.1" placeholder="0"></label>
            <label><span data-i18n="pillC">UH</span><input type="number" id="newFoodC" min="0" step="0.1" placeholder="0"></label>
            <label><span data-i18n="pillF">M</span><input type="number" id="newFoodF" min="0" step="0.1" placeholder="0"></label>
          </div>
          <button class="food-add-btn" id="addFoodBtn" type="button" data-i18n="foodAddBtn">Sačuvaj namirnicu</button>
        </div>
        <div class="food-list" id="customFoodList"></div>
      </aside>
    </div>

    <!-- EDITOR -->
    <main>
      <section class="card day-head">
        <div>
          <div class="day-title" id="dayTitle">—</div>
          <div class="day-sub" id="daySub"></div>
        </div>
        <div class="totals-strip" id="dayTotals">
          <div class="pill"><span class="pill-label" data-i18n="pillP">P</span><span class="pill-value num" data-total="p">0</span></div>
          <div class="pill"><span class="pill-label" data-i18n="pillC">UH</span><span class="pill-value num" data-total="uh">0</span></div>
          <div class="pill"><span class="pill-label" data-i18n="pillF">M</span><span class="pill-value num" data-total="m">0</span></div>
          <div class="pill kcal"><span class="pill-label" data-i18n="pillKcal">kcal</span><span class="pill-value num" data-total="kcal">0</span></div>
        </div>
      </section>

      <section class="meals" id="editor" data-date="">
        <!-- meal cards injected by JS -->
      </section>

      <div class="card add-meal-card">
        <input type="text" id="newMealName" data-i18n-ph="addMealPlaceholder" placeholder="Naziv obroka">
        <input type="time" id="newMealTime" value="12:00">
        <button class="add-meal-btn" id="addMealBtn" type="button" data-i18n="addMealBtn">+ Dodaj obrok</button>
      </div>

      <div class="actions">
        <span class="save-status" id="saveStatus"></span>
        <button class="delete-btn" id="deleteDay" type="button" data-i18n="deleteDayBtn">Obriši dan</button>
        <button class="save-btn" id="saveDay" type="button" data-i18n="saveDayBtn">Sačuvaj dan</button>
      </div>
    </main>
  </div>
</div>

<!-- Reference food list -->
<datalist id="foodsList"></datalist>

<div class="toast" id="toast"></div>

<script>
(function(){

  // ---------- Serbian Latin -> Cyrillic transliteration ----------
  var CYR_DIGRAPHS = [["dž","џ"],["lj","љ"],["nj","њ"]];
  var CYR_SINGLES = {
    "a":"а","b":"б","v":"в","g":"г","d":"д","đ":"ђ","e":"е","ž":"ж","z":"з","i":"и","j":"ј",
    "k":"к","l":"л","m":"м","n":"н","o":"о","p":"п","r":"р","s":"с","t":"т","ć":"ћ","u":"у",
    "f":"ф","h":"х","c":"ц","č":"ч","š":"ш"
  };
  function isUpperChar(ch){ return ch === ch.toUpperCase() && ch !== ch.toLowerCase(); }
  function toCyrillic(str){
    if (!str) return str;
    var lower = str.toLowerCase();
    var out = "";
    var i = 0;
    while (i < str.length){
      var matched = false;
      for (var d = 0; d < CYR_DIGRAPHS.length; d++){
        var lat = CYR_DIGRAPHS[d][0];
        if (lower.substr(i, lat.length) === lat){
          var cyr = CYR_DIGRAPHS[d][1];
          out += isUpperChar(str[i]) ? cyr.toUpperCase() : cyr;
          i += lat.length;
          matched = true;
          break;
        }
      }
      if (matched) continue;
      var ch = str[i];
      var chLower = ch.toLowerCase();
      if (CYR_SINGLES[chLower]){
        out += isUpperChar(ch) ? CYR_SINGLES[chLower].toUpperCase() : CYR_SINGLES[chLower];
      } else {
        out += ch;
      }
      i++;
    }
    return out;
  }

      '<div class="meal-total">' +
        '<span><span data-i18n="pillP">' + T("pillP") + '</span> <b class="mt-p num">0</b></span>' +
        '<span><span data-i18n="pillC">' + T("pillC") + '</span> <b class="mt-uh num">0</b></span>' +
        '<span><span data-i18n="pillF">' + T("pillF") + '</span> <b class="mt-m num">0</b></span>' +
        '<span><span data-i18n="pillKcal">' + T("pillKcal") + '</span> <b class="mt-kcal num">0</b></span>' +
      '</div>' +
      '<button type="button" class="meal-del" data-i18n-title="removeMealTitle" title="' + T("removeMealTitle") + '">×</button>';
    card.appendChild(head);

    var labelInput = head.querySelector(".meal-label-input");
    labelInput.addEventListener("input", function(){
      var m = mealsTemplate.find(function(x){ return x.key === meal.key; });
      if (m){ m.label = labelInput.value; m.isDefault = false; persistMealsTemplate(); }
    });

    var timeInput = head.querySelector(".meal-time");
    timeInput.addEventListener("change", function(){
      var m = mealsTemplate.find(function(x){ return x.key === meal.key; });
      if (m){ m.time = timeInput.value; persistMealsTemplate(); }
    });

    head.querySelector(".meal-del").addEventListener("click", function(){
      var ok = window.confirm(T("confirmDeleteMealPrefix") + labelInput.value + T("confirmDeleteMealSuffix"));
      if (!ok) return;
      mealsTemplate = mealsTemplate.filter(function(x){ return x.key !== meal.key; });
      persistMealsTemplate();
      card.remove();
      recalcAll();
      showToast(T("mealDeletedToast"));
    });

    var table = document.createElement("table");
    table.className = "rows";
    table.innerHTML =
      '<thead><tr>' +
        '<th style="width:44%" data-i18n="colFood">' + T("colFood") + '</th>' +
        '<th style="width:14%" data-i18n="colAmount">' + T("colAmount") + '</th>' +
        '<th data-i18n="pillP">' + T("pillP") + '</th>' +
        '<th data-i18n="pillC">' + T("pillC") + '</th>' +
        '<th data-i18n="pillF">' + T("pillF") + '</th>' +
        '<th data-i18n="pillKcal">' + T("pillKcal") + '</th><th></th>' +
      '</tr></thead><tbody></tbody>';
    var tbody = table.querySelector("tbody");
    for (var r = 0; r < ROWS_PER_MEAL; r++){
      tbody.appendChild(buildRow());
    }
    card.appendChild(table);

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-row";
    addBtn.setAttribute("data-i18n", "addFoodRow");
    addBtn.textContent = T("addFoodRow");
    addBtn.addEventListener("click", function(){
      tbody.appendChild(buildRow());
      recalcAll();
    });
    card.appendChild(addBtn);

    return card;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function buildRow(){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><input class="food-input" list="foodsList" data-i18n-ph="foodPlaceholder" placeholder="' + T("foodPlaceholder") + '" autocomplete="off"></td>' +
      '<td><input class="grams-input num" type="number" min="0" step="1" placeholder="0"></td>' +
      '<td class="num-cell p-cell">0,0</td>' +
      '<td class="num-cell uh-cell">0,0</td>' +
      '<td class="num-cell m-cell">0,0</td>' +
      '<td class="num-cell kcal-cell">0</td>' +
      '<td><button type="button" class="row-del" data-i18n-title="removeRowTitle" title="' + T("removeRowTitle") + '">×</button></td>';
    var foodInput = tr.querySelector(".food-input");
    var gramsInput = tr.querySelector(".grams-input");
    foodInput.addEventListener("input", recalcAll);
    gramsInput.addEventListener("input", recalcAll);
    tr.querySelector(".row-del").addEventListener("click", function(){
      tr.remove();
      recalcAll();
    });
    return tr;
  }

  function recalcAll(){
    var dayTotals = {p:0, uh:0, m:0, kcal:0};
    editorEl.querySelectorAll(".meal-card").forEach(function(card){
      var mealTotals = {p:0, uh:0, m:0, kcal:0};
      card.querySelectorAll("table.rows tbody tr").forEach(function(tr){
        var name = tr.querySelector(".food-input").value.trim();
        var grams = parseFloat(tr.querySelector(".grams-input").value);
        var food = name ? foodIndex[name.toLowerCase()] : null;
        var p=0, uh=0, m=0, kcal=0;
        if (food && !isNaN(grams) && grams > 0){
          var factor = grams / 100;
          p = food.p * factor;
          uh = food.uh * factor;
          m = food.m * factor;
          kcal = food.kcal * factor;
        }
        tr.querySelector(".p-cell").textContent = fmt1(p);
        tr.querySelector(".uh-cell").textContent = fmt1(uh);
        tr.querySelector(".m-cell").textContent = fmt1(m);
        tr.querySelector(".kcal-cell").textContent = fmt0(kcal);
        mealTotals.p += p; mealTotals.uh += uh; mealTotals.m += m; mealTotals.kcal += kcal;
      });
      card.querySelector(".mt-p").textContent = fmt1(mealTotals.p);
      card.querySelector(".mt-uh").textContent = fmt1(mealTotals.uh);
      card.querySelector(".mt-m").textContent = fmt1(mealTotals.m);
      card.querySelector(".mt-kcal").textContent = fmt0(mealTotals.kcal);
      dayTotals.p += mealTotals.p; dayTotals.uh += mealTotals.uh;
      dayTotals.m += mealTotals.m; dayTotals.kcal += mealTotals.kcal;
    });
    document.querySelector('[data-total="p"]').textContent = fmt1(dayTotals.p);
    document.querySelector('[data-total="uh"]').textContent = fmt1(dayTotals.uh);
    document.querySelector('[data-total="m"]').textContent = fmt1(dayTotals.m);
    document.querySelector('[data-total="kcal"]').textContent = fmt0(dayTotals.kcal);
  }

  // ---------- History — persisted in this browser's localStorage ----------
  var STORAGE_KEY = "dnevnik-ishrane-history-v1";

  function loadHistory(){
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function persistHistory(){
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(historyData));
    } catch (e) {
      showToast(T("localStorageError"));
    }
  }

  var historyData = loadHistory(); // { "2026-08-21": { meals: [ {key,time,rows:[{food,grams}]}, ... ] } }

  function findRecord(dateIso){
    return historyData[dateIso] || null;
  }

  function hasRecord(dateIso){
    return !!findRecord(dateIso);
  }

  function loadDate(dateIso){
    activeDate = dateIso;
    editorEl.setAttribute("data-date", dateIso);
    var d = parseIso(dateIso);
    dayTitleEl.textContent = d.toLocaleDateString(localeTag(), {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    datePicker.value = dateIso;

    buildEditor();

    var rec = findRecord(dateIso);
    if (rec){
      rec.meals.forEach(function(mealRec){
        var card = editorEl.querySelector('.meal-card[data-meal="' + mealRec.key + '"]');
        if (!card) return;
        if (mealRec.time) card.querySelector(".meal-time").value = mealRec.time;
        var tbody = card.querySelector("tbody");
        (mealRec.rows || []).forEach(function(rowRec, idx){
          if (!rowRec.food) return;
          var tr = tbody.children[idx];
          if (!tr){ tr = buildRow(); tbody.appendChild(tr); }
          tr.querySelector(".food-input").value = rowRec.food;
          tr.querySelector(".grams-input").value = rowRec.grams;
        });
      });
      daySubEl.textContent = T("daySubLoaded");
    } else {
      daySubEl.textContent = T("daySubEmpty");
    }
    recalcAll();
    renderCalendar();
  }

  function saveDay(){
    var dateIso = activeDate;
    var newRec = { meals: [] };
    var anyFood = false;

    editorEl.querySelectorAll(".meal-card").forEach(function(card){
      var mealKey = card.getAttribute("data-meal");
      var time = card.querySelector(".meal-time").value;
      var mealRec = { key: mealKey, time: time, rows: [] };

      card.querySelectorAll("table.rows tbody tr").forEach(function(tr){
        var name = tr.querySelector(".food-input").value.trim();
        var grams = tr.querySelector(".grams-input").value.trim();
        if (!name || !grams) return;
        anyFood = true;
        mealRec.rows.push({ food: name, grams: grams });
      });
      newRec.meals.push(mealRec);
    });

    if (anyFood){
      historyData[dateIso] = newRec;
    } else {
      delete historyData[dateIso];
    }
    persistHistory();

    renderCalendar();
    showToast(anyFood ? T("savedToast") : T("emptyDeletedToast"));
    var statusEl = document.getElementById("saveStatus");
    statusEl.textContent = T("lastSaved") + new Date().toLocaleTimeString(localeTag(), {hour:"2-digit", minute:"2-digit"});
  }

  function deleteDay(){
    var dateIso = activeDate;
    if (!hasRecord(dateIso)){
      buildEditor();
      recalcAll();
      showToast(T("nothingToDeleteToast"));
      return;
    }
    var ok = window.confirm(T("confirmDeleteDayPrefix") + dateIso + T("confirmDeleteDaySuffix"));
    if (!ok) return;
    delete historyData[dateIso];
    persistHistory();
    buildEditor();
    recalcAll();
    renderCalendar();
    daySubEl.textContent = T("daySubEmpty");
    document.getElementById("saveStatus").textContent = "";
    showToast(T("deletedToast"));
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---------- Custom foods UI ----------
  var newFoodName = document.getElementById("newFoodName");
  var newFoodP = document.getElementById("newFoodP");
  var newFoodC = document.getElementById("newFoodC");
  var newFoodF = document.getElementById("newFoodF");
  var customFoodListEl = document.getElementById("customFoodList");

  function renderCustomFoodList(){
    customFoodListEl.innerHTML = "";
    if (!customFoods.length){
      var empty = document.createElement("div");
      empty.className = "food-list-empty";
      empty.setAttribute("data-i18n", "foodListEmpty");
      empty.textContent = T("foodListEmpty");
      customFoodListEl.appendChild(empty);
      return;
    }
    customFoods.forEach(function(f){
      var row = document.createElement("div");
      row.className = "food-chip";
      row.innerHTML =
        '<span class="fc-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="fc-kcal">' + Math.round(f.kcal) + ' kcal</span>' +
        '<button type="button" class="fc-del">×</button>';
      row.querySelector(".fc-del").addEventListener("click", function(){
        customFoods = customFoods.filter(function(x){ return x.name.toLowerCase() !== f.name.toLowerCase(); });
        persistCustomFoods();
        rebuildFoodIndex();
        renderCustomFoodList();
        recalcAll();
        showToast(T("foodDeletedToast"));
      });
      customFoodListEl.appendChild(row);
    });
  }

  document.getElementById("addFoodBtn").addEventListener("click", function(){
    var name = newFoodName.value.trim();
    if (!name){ showToast(T("foodNameRequiredToast")); return; }
    var p = parseFloat(newFoodP.value) || 0;
    var c = parseFloat(newFoodC.value) || 0;
    var f = parseFloat(newFoodF.value) || 0;
    var kcal = Math.round((p*4 + c*4 + f*9) * 10) / 10;
    var existingIdx = customFoods.findIndex(function(x){ return x.name.toLowerCase() === name.toLowerCase(); });
    var entry = { name: name, p: p, uh: c, m: f, kcal: kcal };
    if (existingIdx >= 0){ customFoods[existingIdx] = entry; } else { customFoods.push(entry); }
    persistCustomFoods();
    rebuildFoodIndex();
    renderCustomFoodList();
    recalcAll();
    newFoodName.value = ""; newFoodP.value = ""; newFoodC.value = ""; newFoodF.value = "";
    showToast(T("foodAddedToast"));
  });

  // ---------- Add-meal UI ----------
  var newMealName = document.getElementById("newMealName");
  var newMealTime = document.getElementById("newMealTime");
  document.getElementById("addMealBtn").addEventListener("click", function(){
    var name = newMealName.value.trim();
    if (!name){ showToast(T("mealNameNeededToast")); return; }
    var key = "obrok-" + Date.now() + "-" + Math.floor(Math.random()*1000);
    var meal = { key: key, label: name, time: newMealTime.value || "12:00", isDefault: false };
    mealsTemplate.push(meal);
    persistMealsTemplate();
    editorEl.appendChild(renderMealCard(meal));
    newMealName.value = "";
    recalcAll();
  });

  // ---------- Calendar (local render) ----------
  var calGrid = document.getElementById("calGrid");
  var calMonthSelect = document.getElementById("calMonthSelect");
  var calYearSelect = document.getElementById("calYearSelect");

  function populateMonthSelect(){
    calMonthSelect.innerHTML = "";
    MONTHS[LANG].forEach(function(name, idx){
      var opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = (LANG === "sr") ? toCyrillic(name) : name;
      calMonthSelect.appendChild(opt);
    });
  }

  function populateYearSelect(){
    var years = [];
    var curYear = today.getFullYear();
    for (var y = curYear - 15; y <= curYear + 5; y++) years.push(y);
    Object.keys(historyData).forEach(function(dateIso){
      var y2 = parseInt(dateIso.slice(0,4), 10);
      if (years.indexOf(y2) === -1) years.push(y2);
    });
    years.sort(function(a,b){ return a-b; });
    calYearSelect.innerHTML = "";
    years.forEach(function(y){
      var opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      calYearSelect.appendChild(opt);
    });
  }

  function renderCalendar(){
    calGrid.innerHTML = "";
    DOW[LANG].forEach(function(d){
      var el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = (LANG === "sr") ? toCyrillic(d) : d;
      calGrid.appendChild(el);
    });

    var firstOfMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
    var startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    var gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - startOffset);

    for (var i = 0; i < 42; i++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      var iso = isoDate(d);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day";
      if (d.getMonth() !== viewMonth.getMonth()) btn.classList.add("is-muted");
      if (iso === todayIso) btn.classList.add("is-today");
      if (iso === activeDate) btn.classList.add("is-selected");
      btn.innerHTML = '<span>' + d.getDate() + '</span>';
      if (hasRecord(iso)){
        var dot = document.createElement("span");
        dot.className = "dot";
        btn.appendChild(dot);
      }
      (function(iso){
        btn.addEventListener("click", function(){ loadDate(iso); });
      })(iso);
      calGrid.appendChild(btn);
    }

    if (calYearSelect.options.length && !calYearSelect.querySelector('option[value="' + viewMonth.getFullYear() + '"]')){
      populateYearSelect();
    }
    calMonthSelect.value = viewMonth.getMonth();
    calYearSelect.value = viewMonth.getFullYear();
  }

  calMonthSelect.addEventListener("change", function(){
    viewMonth = new Date(parseInt(calYearSelect.value, 10), parseInt(calMonthSelect.value, 10), 1);
    renderCalendar();
  });
  calYearSelect.addEventListener("change", function(){
    viewMonth = new Date(parseInt(calYearSelect.value, 10), parseInt(calMonthSelect.value, 10), 1);
    renderCalendar();
  });

  document.getElementById("calPrev").addEventListener("click", function(){
    viewMonth.setMonth(viewMonth.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", function(){
    viewMonth.setMonth(viewMonth.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById("gotoToday").addEventListener("click", function(){
    viewMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    loadDate(todayIso);
  });
  datePicker.addEventListener("change", function(){
    if (!datePicker.value) return;
    var d = parseIso(datePicker.value);
    viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    loadDate(datePicker.value);
  });
  document.getElementById("saveDay").addEventListener("click", saveDay);
  document.getElementById("deleteDay").addEventListener("click", deleteDay);

  // ---------- Language toggle ----------
  var LANG_STORAGE_KEY = LANG_KEY;
  function persistLang(){
    try { window.localStorage.setItem(LANG_STORAGE_KEY, LANG); } catch(e){}
  }

  function applyLanguage(){
    document.documentElement.lang = LANG === "en" ? "en" : "sr";
    document.title = T("brandTitle");

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      el.textContent = T(key);
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
      var key = el.getAttribute("data-i18n-ph");
      el.setAttribute("placeholder", T(key));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function(el){
      var key = el.getAttribute("data-i18n-aria");
      el.setAttribute("aria-label", T(key));
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function(el){
      var key = el.getAttribute("data-i18n-title");
      el.setAttribute("title", T(key));
    });

    document.getElementById("langToggle").textContent = T("langBtn");

    // swap untouched default meal labels to the new language
    mealsTemplate.forEach(function(m){
      if (m.isDefault && DEFAULT_MEAL_LABELS.sr[m.key] !== undefined){
        m.label = mealLabelFor(m.key);
      }
    });
    persistMealsTemplate();
    rebuildFoodIndex();
    document.querySelectorAll(".meal-card").forEach(function(card){
      var key = card.getAttribute("data-meal");
      var m = mealsTemplate.find(function(x){ return x.key === key; });
      if (m && m.isDefault){
        card.querySelector(".meal-label-input").value = m.label;
      }
    });

    renderCustomFoodList();
    populateMonthSelect();
    if (!calYearSelect.options.length) populateYearSelect();
    renderCalendar();

    var d = parseIso(activeDate);
    dayTitleEl.textContent = d.toLocaleDateString(localeTag(), {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    daySubEl.textContent = hasRecord(activeDate) ? T("daySubLoaded") : T("daySubEmpty");

    recalcAll();
  }

  document.getElementById("langToggle").addEventListener("click", function(){
    LANG = (LANG === "sr") ? "en" : "sr";
    persistLang();
    applyLanguage();
  });

  // ---------- init ----------
  applyLanguage();
  renderCustomFoodList();
  loadDate(todayIso);
})();
</script>
</body>
</html>
